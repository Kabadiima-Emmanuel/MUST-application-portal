<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Allows the form to adapt to the available screen width. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account | MUST Admissions Portal</title>
  <!-- Shared with index.html so both pages have the same visual language. -->
  <link rel="stylesheet" href="designs.css" />
</head>
<body>
  <main class="page">
    <section class="auth-card" aria-labelledby="create-title">
      <!-- Place the university logo file named logo.png beside these HTML files. -->
      <img class="logo" src="logo.png" alt="Mbarara University of Science and Technology logo" />
      <p class="portal-name">MUST Admissions Portal</p>
      <h1 id="create-title">Create an account</h1>
      <p class="intro">Register your details to begin a university application.</p>

      <!-- This form currently demonstrates the interface-->
      <form action="#">
        <div class="name-fields">
          <label for="first-name">
            First name
            <input id="first-name" name="firstName" type="text" autocomplete="given-name" required />
          </label>
          <label for="last-name">
            Last name
            <input id="last-name" name="lastName" type="text" autocomplete="family-name" required />
          </label>
        </div>

        <label for="create-email">
          Email address
          <input id="create-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </label>

        <label for="mobile-number">
          Mobile number
          <input id="mobile-number" name="mobile" type="tel" placeholder="+256 700 000 000" autocomplete="tel" required />
        </label>

        <label for="create-password">
          Password
          <input id="create-password" name="password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required />
        </label>

        <label class="check" for="terms-agreement">
          <input id="terms-agreement" name="termsAgreement" type="checkbox" required />
          <span>I agree to the <a href="#terms">terms</a> and <a href="#privacy">privacy notice</a>.</span>
        </label>

        <button type="submit">Create account</button>
      </form>

      <p class="alternate">Already have an account? <a href="index.html">Sign in</a></p>
    </section>

    <footer>© 2026 Mbarara University of Science and Technology</footer>
  </main>
</body>
</html>
